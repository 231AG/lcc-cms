services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lcc_eportal_dev
    ports:
      - "54329:5432"
    volumes:
      - lcc_pg_data:/var/lib/postgresql/data

volumes:
  lcc_pg_data:
